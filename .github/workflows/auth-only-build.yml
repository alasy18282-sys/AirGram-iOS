name: Auth-Only Build AirGram iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auth-only-build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euxo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          XCODE_APP=""
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app" \
            "/Applications/Xcode_${XCODE_VERSION}.1.app" \
            "/Applications/Xcode.app"; do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "No suitable Xcode found. Installed versions:"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: ${{ runner.os }}-bazel-auth-only-v2-${{ hashFiles('WORKSPACE', 'WORKSPACE.bzlmod', 'MODULE.bazel', '.bazelrc', 'build-system/Make/Make.py', 'Telegram/BUILD', 'submodules/AuthorizationUI/BUILD', 'submodules/LegacyComponents/BUILD') }}
          restore-keys: |
            ${{ runner.os }}-bazel-auth-only-v2-

      - name: Compile auth-only target
        run: |
          set -euxo pipefail
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --target=Telegram/telegram_auth_build_test \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect auth-only artifacts
        run: |
          set -euxo pipefail
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import sys
          import zipfile

          output_path = "build/artifacts"
          search_roots = ["bazel-bin", "bazel-out", "/private/var/tmp/_bazel_containerhost"]

          def collect(pattern: str, expect_dir: bool):
              matches = []
              for root in search_roots:
                  if not os.path.exists(root):
                      continue
                  root_matches = glob.glob(os.path.join(root, "**", pattern), recursive=True)
                  for path in root_matches:
                      if expect_dir and os.path.isdir(path):
                          matches.append(os.path.abspath(path))
                      if not expect_dir and os.path.isfile(path):
                          matches.append(os.path.abspath(path))
              return sorted(set(matches), key=os.path.getmtime, reverse=True)

          ipa_candidates = collect("telegram_auth_build_test.ipa", expect_dir=False)
          if not ipa_candidates:
              print("No auth-only IPA artifacts found.", file=sys.stderr)
              debug = collect("telegram_auth_build_test*", expect_dir=False)[:20]
              for item in debug:
                  print(f"debug-file: {item}", file=sys.stderr)
              debug_dirs = collect("telegram_auth_build_test*", expect_dir=True)[:20]
              for item in debug_dirs:
                  print(f"debug-dir: {item}", file=sys.stderr)
              sys.exit(1)

          ipa_path = ipa_candidates[0]
          print(f"Using IPA: {ipa_path}")
          shutil.copy2(ipa_path, os.path.join(output_path, os.path.basename(ipa_path)))

          base_dir = os.path.dirname(ipa_path)
          app_bundle = os.path.join(base_dir, "telegram_auth_build_test.app")
          if os.path.isdir(app_bundle):
              shutil.make_archive(os.path.join(output_path, "telegram_auth_build_test.app"), "zip", root_dir=os.path.dirname(app_bundle), base_dir=os.path.basename(app_bundle))
              print(f"Packed app bundle: {app_bundle}")

          dsym_candidates = []
          local_dsym = glob.glob(os.path.join(base_dir, "telegram_auth_build_test*.dSYM"))
          dsym_candidates.extend([p for p in local_dsym if os.path.isdir(p)])
          if not dsym_candidates:
              dsym_candidates = collect("telegram_auth_build_test*.dSYM", expect_dir=True)

          copied_dsyms = []
          for dsym in dsym_candidates:
              target = os.path.join(output_path, os.path.basename(dsym))
              if os.path.exists(target):
                  continue
              shutil.copytree(dsym, target)
              copied_dsyms.append(target)

          if copied_dsyms:
              dsym_zip = os.path.join(output_path, "telegram_auth_build_test.dSYM.zip")
              with zipfile.ZipFile(dsym_zip, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for dsym_dir in copied_dsyms:
                      for root, _, files in os.walk(dsym_dir):
                          for file_name in files:
                              file_path = os.path.join(root, file_name)
                              archive_path = os.path.relpath(file_path, output_path)
                              zf.write(file_path, arcname=archive_path)
              for dsym_dir in copied_dsyms:
                  shutil.rmtree(dsym_dir)
              print(f"Packed dSYM count: {len(copied_dsyms)}")
          PY

          ls -la "$OUTPUT_PATH"

      - name: Upload auth-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirGram-auth-only-${{ env.BUILD_NUMBER }}
          path: build/artifacts/*
          if-no-files-found: error

      - name: Create auth-only release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auth-only-${{ env.BUILD_NUMBER }}-${{ github.run_number }}
          name: AirGram Auth-Only (${{ env.BUILD_NUMBER }})
          body: |
            Auth-only build with persistent Logs button and Telegram Web export.
          files: build/artifacts/*
          fail_on_unmatched_files: false
          prerelease: true

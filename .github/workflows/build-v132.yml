name: Build AirGram iOS (13.2)

on:
  push:
    branches: [ v132 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v132-build
  cancel-in-progress: false

env:
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import subprocess

          want = json.load(open("versions.json"))["xcode"]
          want_tuple = tuple(int(part) for part in want.split("."))
          candidates = []
          for path in glob.glob("/Applications/Xcode*.app"):
              match = re.search(r"Xcode_([0-9][0-9.]*)\.app$", path)
              if match:
                  version = tuple(int(part) for part in match.group(1).split("."))
                  candidates.append((version, path))
          candidates.sort(reverse=True)
          picked = None
          for version, path in candidates:
              if version >= want_tuple:
                  picked = path
                  break
          if picked is None and candidates:
              picked = candidates[0][1]
          if picked is None:
              picked = "/Applications/Xcode.app"
          print("Selected:", picked)
          subprocess.check_call(["sudo", "xcode-select", "-s", os.path.join(picked, "Contents", "Developer")])
          PY
          xcodebuild -version

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          pkg-config --version

      - name: Fix script permissions
        run: |
          set -euxo pipefail
          find . -name '*.sh' -print0 | xargs -0 chmod +x
          find submodules/ffmpeg third-party -type f \( -name configure -o -name pkg-config -o -name '*.pl' \) -print0 | xargs -0 chmod +x

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: ${{ runner.os }}-bazel-v132-${{ hashFiles('MODULE.bazel', '.bazelrc', 'build-system/Make/Make.py', 'Telegram/BUILD') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-v132-
            ${{ runner.os }}-bazel-layer229-v2-

      - name: Build AirGram device IPA
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="${GITHUB_RUN_NUMBER:-1}"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # The provisioning profiles are committed already re-issued for
          # org.airgram.ios with a 2035 expiry, so no rebranding step is needed
          # (and RewriteProfilesBundleId.py does not exist in the 13.2 tree).
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_USER_ROOT/disk_cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/bazel-artifacts \
            --buildNumber="$BUILD_NUMBER" \
            --enableParallelSwiftmoduleGeneration 2>&1 | tee ci_logs/build.log

      - name: Dump build errors on failure
        if: failure()
        run: |
          set -x
          mkdir -p ci_logs
          { grep -aE "error:|fatal error:|BUILD FAILED|ERROR: " ci_logs/build.log | head -200; true; } > ci_logs/errors.txt
          wc -l ci_logs/errors.txt
          tail -c 200000 ci_logs/build.log | tr -cd '\11\12\15\40-\176' > ci_logs/build_tail.txt
          cat ci_logs/errors.txt

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirGram-13.2-failure-log
          path: |
            ci_logs/errors.txt
            ci_logs/build_tail.txt
          if-no-files-found: warn

      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import zipfile

          output_path = "build/artifacts"
          search_roots = ["build/bazel-artifacts", "bazel-bin", "bazel-out"]

          def collect(pattern, expect_dir):
              matches = []
              for root in search_roots:
                  if not os.path.exists(root):
                      continue
                  for path in glob.glob(os.path.join(root, "**", pattern), recursive=True):
                      if expect_dir and os.path.isdir(path):
                          matches.append(os.path.abspath(path))
                      if not expect_dir and os.path.isfile(path):
                          matches.append(os.path.abspath(path))
              return sorted(set(matches), key=os.path.getmtime, reverse=True)

          ipa_candidates = collect("Telegram.ipa", expect_dir=False) or collect("*.ipa", expect_dir=False)
          if not ipa_candidates:
              print("No IPA artifacts found.", flush=True)
              raise SystemExit(1)

          ipa_path = ipa_candidates[0]
          print("Using IPA:", ipa_path, flush=True)
          shutil.copy2(ipa_path, os.path.join(output_path, "AirGram-13.2.ipa"))

          dsym_candidates = collect("*.dSYM", expect_dir=True)
          copied = []
          for dsym in dsym_candidates:
              target = os.path.join(output_path, os.path.basename(dsym))
              if os.path.exists(target):
                  continue
              shutil.copytree(dsym, target)
              copied.append(target)
          if copied:
              with zipfile.ZipFile(os.path.join(output_path, "AirGram-13.2.dSYM.zip"), "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  for dsym_dir in copied:
                      for root, _, files in os.walk(dsym_dir):
                          for file_name in files:
                              file_path = os.path.join(root, file_name)
                              archive.write(file_path, arcname=os.path.relpath(file_path, output_path))
              for dsym_dir in copied:
                  shutil.rmtree(dsym_dir)
          PY
          ls -la "$OUTPUT_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirGram-13.2-${{ env.BUILD_NUMBER }}
          path: build/artifacts/*
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v132-${{ env.BUILD_NUMBER }}-${{ github.run_number }}
          name: AirGram 13.2 (${{ env.BUILD_NUMBER }})
          body: |
            Device IPA (release_arm64) built from the v132 branch: Telegram-iOS 13.2 base,
            AirGram branding, MyTelegram server patches (177.202.67.63:20443).
          files: build/artifacts/*
          fail_on_unmatched_files: false
          prerelease: true

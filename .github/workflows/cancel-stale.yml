name: Cancel stale builds

on:
  push:
    branches: [ layer229 ]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel in-progress layer229 builds for older commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          gh run list --repo "$REPO" --status in_progress --limit 50 \
            --json databaseId,headSha,workflowName > /tmp/runs.json
          cat /tmp/runs.json
          gh run list --repo "$REPO" --status in_progress --limit 50 \
            --json databaseId,headSha,workflowName \
            --jq ".[] | select(.workflowName == \"Build AirGram iOS (layer 229)\" and .headSha != \"$CURRENT_SHA\") | .databaseId" \
            | while read -r run_id; do
                if [ -n "$run_id" ]; then
                  echo "Cancelling stale run $run_id"
                  gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel"
                fi
              done
          echo "done"
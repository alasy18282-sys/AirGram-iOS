name: Build AirGram iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euxo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          XCODE_APP=""
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app" \
            "/Applications/Xcode_${XCODE_VERSION}.1.app" \
            "/Applications/Xcode.app"; do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "No suitable Xcode found. Installed versions:"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          pkg-config --version

      - name: Fix script permissions
        run: |
          set -euxo pipefail
          find . -name '*.sh' -print0 | xargs -0 chmod +x
          find submodules/ffmpeg third-party -type f \( -name configure -o -name pkg-config -o -name '*.pl' \) -print0 | xargs -0 chmod +x

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: ${{ runner.os }}-bazel-full-device-v1-${{ hashFiles('WORKSPACE', 'WORKSPACE.bzlmod', 'MODULE.bazel', '.bazelrc', 'build-system/Make/Make.py', 'Telegram/BUILD') }}
          restore-keys: |
            ${{ runner.os }}-bazel-full-device-v1-
            ${{ runner.os }}-bazel-auth-device-v1-
            ${{ runner.os }}-bazel-auth-only-v2-

      - name: Build AirGram auth-only IPA (faster)
        run: |
          set -euxo pipefail
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 build-system/Make/RewriteProfilesBundleId.py \
            --profiles build-system/fake-codesigning/profiles \
            --certs build-system/fake-codesigning/certs \
            --old-bundle ph.telegra.Telegraph \
            --new-bundle org.airgram.ios

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --target=Telegram/telegram_auth_build_test \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect full artifacts
        run: |
          set -euxo pipefail
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import sys
          import zipfile

          output_path = "build/artifacts"
          search_roots = ["bazel-bin", "bazel-out", "/private/var/tmp/_bazel_containerhost"]

          def collect(pattern: str, expect_dir: bool):
              matches = []
              for root in search_roots:
                  if not os.path.exists(root):
                      continue
                  for path in glob.glob(os.path.join(root, "**", pattern), recursive=True):
                      if expect_dir and os.path.isdir(path):
                          matches.append(os.path.abspath(path))
                      if not expect_dir and os.path.isfile(path):
                          matches.append(os.path.abspath(path))
              return sorted(set(matches), key=os.path.getmtime, reverse=True)

          ipa_candidates = collect("telegram_auth_build_test.ipa", expect_dir=False)
          if not ipa_candidates:
              ipa_candidates = collect("Telegram.ipa", expect_dir=False)
          if not ipa_candidates:
              print("No Telegram.ipa found.", file=sys.stderr)
              for item in collect("*.ipa", expect_dir=False)[:40]:
                  print(f"debug-ipa: {item}", file=sys.stderr)
              sys.exit(1)

          ipa_path = ipa_candidates[0]
          print(f"Using IPA: {ipa_path}")
          shutil.copy2(ipa_path, os.path.join(output_path, "AirGram.ipa"))
          shutil.copy2(ipa_path, os.path.join(output_path, "Telegram.ipa"))

          base_dir = os.path.dirname(ipa_path)
          dsym_candidates = [p for p in glob.glob(os.path.join(base_dir, "*.dSYM")) if os.path.isdir(p)]
          if not dsym_candidates:
              dsym_candidates = collect("Telegram*.dSYM", expect_dir=True)

          if dsym_candidates:
              dsym_root = os.path.join(output_path, "DSYMs")
              os.makedirs(dsym_root, exist_ok=True)
              for dsym in dsym_candidates:
                  target = os.path.join(dsym_root, os.path.basename(dsym))
                  if os.path.exists(target):
                      continue
                  shutil.copytree(dsym, target)
              dsym_zip = os.path.join(output_path, "AirGram.DSYMs.zip")
              with zipfile.ZipFile(dsym_zip, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for root, _, files in os.walk(dsym_root):
                      for file_name in files:
                          file_path = os.path.join(root, file_name)
                          zf.write(file_path, arcname=os.path.relpath(file_path, output_path))
              shutil.rmtree(dsym_root)
          PY
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirGram-iOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: build/artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: AirGram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            AirGram iOS device build (`org.airgram.ios`) — auth-only target (~2x faster, no extensions).
            Custom server `169.58.61.186:20443`.
          files: build/artifacts/*
          fail_on_unmatched_files: false
